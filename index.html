<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="A clean, local chat interface for your Ollama models." />
  <title>Ollama Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315b79e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 8V4H8'/%3E%3Crect width='16' height='12' x='4' y='8' rx='2'/%3E%3Cpath d='M2 14h2'/%3E%3Cpath d='M20 14h2'/%3E%3C/svg%3E" />

  <!-- Apply the stored theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem('ollamachat.settings.v1') || '{}');
        document.documentElement.classList.toggle('dark', stored.theme !== 'light');
      } catch (err) { /* keep the default dark theme */ }
    })();
  </script>

  <!-- Tailwind CSS (browser build, no tooling required) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: {
              50: '#eefdf9', 100: '#d5f9ef', 200: '#aef2e1', 300: '#79e6cf',
              400: '#3ed2b6', 500: '#15b79e', 600: '#0a9383', 700: '#0b756a',
              800: '#0d5d56', 900: '#104d48', 950: '#032e2c'
            }
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'Liberation Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Syntax highlighting themes (one is disabled based on the active theme) -->
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" disabled />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="h-full">
  <div class="app-shell">

    <!-- ================= Sidebar ================= -->
    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" data-icon="bot" data-icon-size="20"></span>
          <span class="brand-text">
            <span class="brand-name">Ollama Chat</span>
            <span class="brand-sub">Local models</span>
          </span>
        </div>
        <button id="sidebar-close" class="icon-btn lg:hidden" type="button" aria-label="Close sidebar" data-icon="x"></button>
      </div>

      <div class="sidebar-actions">
        <button id="new-chat-side" class="btn-primary btn-block" type="button">
          <span data-icon="plus" data-icon-size="16"></span>
          <span>New chat</span>
        </button>
      </div>

      <div class="sidebar-label">Chats</div>
      <div id="chat-list" class="chat-list"></div>

      <div class="sidebar-foot">
        <button id="clear-all" class="btn-ghost btn-block" type="button">
          <span data-icon="trash-2" data-icon-size="16"></span>
          <span>Clear all chats</span>
        </button>
        <p id="storage-note" class="storage-note">History is stored in this browser only.</p>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="backdrop" hidden></div>

    <!-- ================= Main ================= -->
    <div class="main-col">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn lg:hidden" type="button" aria-label="Open sidebar" data-icon="menu"></button>

        <div class="model-wrap">
          <select id="model-select" class="model-select" aria-label="Model" disabled>
            <option value="">No models</option>
          </select>
          <span class="model-caret" data-icon="chevron-down" data-icon-size="16"></span>
        </div>

        <button id="status-badge" class="badge" type="button" data-state="checking" title="Click to re-check the connection">
          <span class="badge-dot"></span>
          <span class="badge-label">Checking…</span>
        </button>

        <div class="topbar-right">
          <button id="settings-btn" class="icon-btn" type="button" aria-label="System prompt settings" data-icon="settings"></button>
          <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme" data-icon="moon"></button>
        </div>
      </header>

      <div id="conn-banner" class="banner" hidden>
        <span class="banner-icon" data-icon="alert-triangle" data-icon-size="16"></span>
        <span id="conn-banner-text" class="banner-text"></span>
        <button id="retry-btn" class="btn-ghost btn-sm" type="button">
          <span data-icon="refresh-cw" data-icon-size="14"></span>
          <span>Retry</span>
        </button>
      </div>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

      <footer class="composer">
        <div class="composer-inner">
          <div class="composer-box">
            <textarea id="prompt" class="composer-input" rows="1" placeholder="Message Ollama…  (Enter to send, Shift + Enter for a new line)" aria-label="Message"></textarea>
            <button id="send-btn" class="send-btn" type="button" data-mode="send" aria-label="Send message">
              <span class="send-icon-send" data-icon="send" data-icon-size="18"></span>
              <span class="send-icon-stop" data-icon="square" data-icon-size="16"></span>
            </button>
          </div>
          <p class="composer-hint">
            <span id="composer-model">—</span>
            <span class="dot-sep">·</span>
            <span id="composer-system">No system prompt</span>
          </p>
        </div>
      </footer>
    </div>
  </div>

  <!-- ================= System prompt modal ================= -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title" class="modal-title">System prompt</h2>
        <button class="icon-btn" type="button" aria-label="Close" data-close-modal data-icon="x"></button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="system-prompt">Instructions sent with every conversation</label>
        <textarea id="system-prompt" class="input" rows="7" placeholder="e.g. You are a concise senior software engineer. Prefer short answers with code examples."></textarea>
        <p class="hint">Leave empty to send no system message. Changes apply from your next message on.</p>
      </div>
      <div class="modal-foot">
        <button id="reset-prompt" class="btn-ghost" type="button">Reset</button>
        <button id="save-prompt" class="btn-primary" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- ================= Dependencies & app ================= -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
